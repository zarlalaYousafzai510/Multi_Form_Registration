
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Registration Form</h1>

    <div class="progress-container">
        <p id="stepText">Step 1 of 3</p>
        <div class="progress-track">
            <div id="progressBar"></div>
        </div>
    </div>

    <form id="registrationForm">

        
        <section class="step active">
            <h2>Personal Information</h2>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="fatherName">Father Name:</label>
            <input type="text" id="fatherName" name="fatherName" required>
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>

            <label>Gender:</label>
            <br>

            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <br><br>

            <button type="button" class="next">Next</button>
        </section>

       
        <section class="step">
            <h2>Contact Information</h2>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>
            <br><br>

            <label for="city">City:</label>
            <select id="city" name="city" required>
                <option value="">Select City</option>
                <option value="Mardan">Mardan</option>
                <option value="Peshawar">Peshawar</option>
                <option value="Islamabad">Islamabad</option>
                <option value="Lahore">Lahore</option>
                <option value="Karachi">Karachi</option>
            </select>
            <br><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" required></textarea>
            <br><br>

            <button type="button" class="previous">Previous</button>
            <button type="button" class="next">Next</button>
        </section>

        
        <section class="step">
            <h2>Account Information</h2>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            <br><br>

            <button type="button" class="previous">Previous</button>
            <button type="button" id="reviewButton">Review</button>
        </section>

        
        <section class="step" id="summary">
            <h2>Review Your Information</h2>

            <div id="summaryContent"></div>

            <button type="button" id="editButton">Edit Information</button>
            <button type="submit">Submit Registration</button>
        </section>
<p id="statusMessage" role="status"></p>

    </form>

    <script src="script.js"></script>

</body>
</html>
